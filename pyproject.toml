[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-bot"
version = "1.0.0"
description = "Relative Strength Index signal research toolkit built on Yahoo Finance data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Selim Çalıcı" }]
keywords = ["rsi", "technical-analysis", "trading", "yfinance", "quant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.0",
    "yfinance>=0.2.40",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
rsi-bot = "rsi_bot.cli:main"

[tool.setuptools]
packages = ["rsi_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
